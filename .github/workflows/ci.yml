name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Download raw data
        run: uv run python scripts/download_data.py
      - name: dbt build (models + tests)
        working-directory: olist_dbt
        env:
          DBT_PROFILES_DIR: .
        run: uv run dbt build
      - name: Validate Dagster definitions
        run: uv run dagster definitions validate -m orchestration.definitions
